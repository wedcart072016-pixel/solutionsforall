<!doctype html>
<html lang="en">
  <head><meta name="robots" content="noindex, nofollow, noai, noimageai" />
    <script src="./wedready.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ebe3d3" />
    <meta name="description" content="You are warmly invited to the wedding of Hamza &amp; Ayesha · 15–18 October 2026." />
    <title>Hamza &amp; Ayesha — Wedding Invitation</title>
    <link rel="preload" as="image" href="./assets/images/envelope-poster.jpg" />
    <link rel="stylesheet" href="./assets/css/olive.css?v=6" />
    <script src="./assets/js/config.js?v=2"></script>
    <script src="./assets/js/brand.js?v=2"></script>
    <script>window.WED_FOOTER_MOUNT = "#page";</script>
    <script src="./assets/js/wed-footer.js?v=3" defer></script>
    <script src="./assets/js/wed-calendar.js?v=1" defer></script>
    <script src="./assets/js/wed-scratch.js?v=2" defer></script>
    <script src="./assets/js/wed-leaves.js?v=1" defer></script>
    <script src="./assets/js/quran-quiet.js?v=1" defer></script>
    <script src="./assets/js/app.js?v=5" defer></script>
  </head>
  <body>
    <div id="cover" class="cover" role="button" tabindex="0" aria-label="Open the invitation">
      <div class="cover-stage" id="coverStage">
        <video id="envVideo" class="cover-video" src="./assets/video/envelope.mp4" poster="./assets/images/envelope-poster.jpg" muted playsinline webkit-playsinline preload="auto"></video>
      </div>
      <p class="cover-hint" id="coverHint"></p>
      <button type="button" class="skip" id="skip"></button>
      <div class="cover-veil" aria-hidden="true"></div>
    </div>

    <main id="page" class="page" aria-live="polite">
      <section class="hero" id="hero">
        <div class="hero-top">
          <div class="chandelier-drop"><img class="chandelier" src="./assets/images/chandelier.webp" alt="" aria-hidden="true" /></div>
          <div class="greenery-drop"><img class="greenery" src="./assets/images/greenery.webp" alt="" aria-hidden="true" /></div>
        </div>
        <div class="hero-text" id="heroText"></div>
        <div class="banquet-rise"><img class="banquet" src="./assets/images/banquet.webp" alt="" aria-hidden="true" /></div>
      </section>
      <div id="sections"></div>
    </main>

    <button type="button" class="music" id="musicBtn" hidden></button>
    <audio id="music" preload="none" loop></audio>
  </body>
</html>
